<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeMirror Decorations</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>CodeMirror Decorations</h1>

      <section>
        <h2>1) Mark Decoration</h2>
        <div id="mark-demo"></div>
        <div id="mark-code" class="demo-code"></div>
      </section>

      <section>
        <h2>2) Widget Decoration</h2>
        <div id="widget-demo"></div>
        <div id="widget-code" class="demo-code"></div>
      </section>

      <section>
        <h2>3) Replace Decoration</h2>
        <div id="replace-demo"></div>
        <div id="replace-code" class="demo-code"></div>
      </section>

      <section>
        <h2>4) Line Decoration</h2>
        <div id="line-demo"></div>
        <div id="line-code" class="demo-code"></div>
      </section>

      <section>
        <h2>5) BlockWrapper</h2>
        <div id="block-wrapper-demo"></div>
        <div id="block-wrapper-code" class="demo-code"></div>
      </section>
    </main>

    <script type="module" src="./main.mjs"></script>
  </body>
</html>
